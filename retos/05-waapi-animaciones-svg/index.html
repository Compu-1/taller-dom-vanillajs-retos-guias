<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reto 5 - 5. Web Animations API (WAAPI) y Métricas SVG</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 1.5rem;
      background: #0b1120;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 1.5rem;
    }
    .badge {
      display: inline-block;
      background: #4cb97822;
      color: #4cb978;
      border: 1px solid #4cb978;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .btn-switch {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-switch:hover { background: #475569; }
    .btn-switch.active {
      background: #2563eb;
      border-color: #3b82f6;
    }
    .card-mission {
      background: #1e293b;
      border-left: 4px solid #4cb978;
      border-radius: 0 8px 8px 0;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
    }
    .card-mission h4 { margin: 0 0 0.35rem 0; font-size: 1rem; color: #f1f5f9; }
    .card-mission p { margin: 0; font-size: 0.9rem; color: #cbd5e1; line-height: 1.4; }
    #sandbox-root {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 1.5rem;
      min-height: 200px;
    }
    .console-panel {
      margin-top: 1.5rem;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      overflow: hidden;
    }
    .console-header {
      background: #0f172a;
      padding: 0.5rem 1rem;
      font-weight: 700;
      color: #94a3b8;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
    }
    .console-body {
      padding: 0.75rem 1rem;
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .log-entry { line-height: 1.4; }
    .log-info { color: #38bdf8; }
    .log-warn { color: #f59e0b; }
    .log-error { color: #f87171; }
    .log-success { color: #4ade80; }
  </style>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="header-bar">
    <div>
      <span class="badge">Animaciones & SVG</span>
      <h2 style="margin: 0.4rem 0 0 0; font-size: 1.35rem;">5. Web Animations API (WAAPI) y Métricas SVG</h2>
    </div>
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <button id="btn-starter" class="btn-switch active" onclick="loadScript('app.js')">Trabajo (app.js)</button>
      <button id="btn-solution" class="btn-switch" onclick="loadScript('solution.js')">Solución (solution.js)</button>
    </div>
  </div>

  <div class="card-mission">
    <h4>🎯 Misión del Reto</h4>
    <p>Completa la función animateGauge(circle, percentage) para calcular el desfase perimétrico del SVG y animar la transición con easing cúbico.</p>
  </div>

  <!-- Raíz de Montaje del DOM -->
  <div id="sandbox-root"></div>

  <!-- Consola en Vivo -->
  <div class="console-panel">
    <div class="console-header">
      <span>Consola JavaScript en Vivo</span>
      <span id="active-script-label" style="color: #38bdf8;">Ejecutando: app.js</span>
    </div>
    <div id="console-output" class="console-body"></div>
  </div>

  <script>
    // Interceptor de consola
    const consoleBox = document.getElementById("console-output");
    function appendLog(type, text) {
      if (!consoleBox) return;
      const el = document.createElement("div");
      el.className = "log-entry log-" + type;
      el.textContent = "[" + new Date().toLocaleTimeString() + "] " + text;
      consoleBox.appendChild(el);
      consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    const _origLog = console.log;
    const _origWarn = console.warn;
    const _origError = console.error;
    const _origInfo = console.info;

    console.log = function(...args) {
      const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
      appendLog(msg.includes('✅') ? 'success' : 'info', msg);
      _origLog.apply(console, args);
    };
    console.warn = function(...args) {
      appendLog('warn', args.join(' '));
      _origWarn.apply(console, args);
    };
    console.error = function(...args) {
      appendLog('error', args.join(' '));
      _origError.apply(console, args);
    };
    console.info = function(...args) {
      appendLog('info', args.join(' '));
      _origInfo.apply(console, args);
    };

    window.addEventListener("error", function(e) {
      appendLog('error', "Error en ejecución: " + e.message);
    });

    function resetSandbox() {
      consoleBox.innerHTML = "";
      const root = document.getElementById("sandbox-root");
      if (root) root.innerHTML = "";
    }

    function runHarnessPre() {
      try {
        
// --- [HARNESS OCULTO - SETUP SVG] ---
window.PERIMETRO = 2 * Math.PI * 42;
const root = document.getElementById("sandbox-root");
if (root) {
  root.innerHTML = `
    <div class="gauge-card">
      <svg class="gauge-svg" width="140" height="140" viewBox="0 0 100 100">
        <circle class="gauge-bg" cx="50" cy="50" r="42" />
        <circle id="meter-circle" class="gauge-progress" cx="50" cy="50" r="42" stroke-dasharray="263.89" stroke-dashoffset="263.89" />
      </svg>
      <div id="meter-value" class="gauge-label">0%</div>
      <div class="slider-container">
        <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: #94a3b8;">
          <span>Carga de CPU</span>
          <span id="slider-txt">75%</span>
        </div>
        <input type="range" id="cpu-slider" min="0" max="100" value="75" />
      </div>
    </div>
  `;
}
    
      } catch(e) {
        console.error("Fallo en setup:", e.message);
      }
    }

    function runHarnessPost() {
      try {
        
setTimeout(() => {
  const circleEl = document.getElementById("meter-circle");
  const p = window.PERIMETRO || 263.89;
  if (circleEl && circleEl.dataset.offset && parseFloat(circleEl.dataset.offset) < p) {
    console.log("✅ EVALUACIÓN EXITOSA: WAAPI animando a 60 FPS con interpolación perimétrica correcta.");
  } else {
    console.warn("⚠️ Completa los TODOs en animateGauge(): calcula targetOffset, ejecuta circleEl.animate() y guarda circleEl.dataset.offset.");
  }
}, 100);
    
      } catch(e) {
        console.error("Fallo en verificación:", e.message);
      }
    }

    function loadScript(scriptName) {
      resetSandbox();
      document.getElementById("btn-starter").className = scriptName === 'app.js' ? 'btn-switch active' : 'btn-switch';
      document.getElementById("btn-solution").className = scriptName === 'solution.js' ? 'btn-switch active' : 'btn-switch';
      document.getElementById("active-script-label").textContent = "Ejecutando: " + scriptName;

      runHarnessPre();

      // Cargar script dinámicamente
      fetch(scriptName + "?t=" + Date.now())
        .then(res => res.text())
        .then(code => {
          try {
            const runner = new Function(code);
            runner();
            runHarnessPost();
          } catch(err) {
            console.error("Error (" + err.name + "): " + err.message);
          }
        })
        .catch(err => {
          console.error("Error al cargar " + scriptName + ":", err.message);
        });
    }

    // Inicializar al cargar
    window.addEventListener("DOMContentLoaded", () => {
      loadScript("app.js");
    });
  </script>
</body>
</html>
